[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "healthagentbench"
version = "0.1.0"
description = "Healthcare Agent Benchmark with self-contained mini agent"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "requests",
    "python-dotenv",
    "pytest>=8",
    "langgraph>=0.2,<1.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "markdown>=3.10.3",
]

[tool.setuptools.packages.find]
include = ["agent*", "scripts*", "utils*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
